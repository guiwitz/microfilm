name: tests

on: 
  push:
    branches:
      - master
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Setup python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"

      # Temporary fix for 'pip install imageio-ffmpeg'
      # not including the FFMPEG binary on Apple Silicon macs
      # This step can be removed when issue is fixed in imageio-ffmpeg
      # https://github.com/imageio/imageio-ffmpeg/issues/71
      - name: Setup FFmpeg
        if: ${{ runner.os == 'macOS' && runner.arch == 'ARM64' }}
        run: |
          brew update
          brew install ffmpeg
      
      - name: Test with tox
        run: uvx --with tox-gh-actions tox -- ${{ matrix.group.files }}
        env:
          PLATFORM: ${{ matrix.platform }}

  build-and-inspect-package:
    name: Build & inspect package.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: hynek/build-and-inspect-python-package@v2

  deploy:
    # this will run when you have tagged a commit, starting with "v*"
    # and requires that you have put your twine API key in your
    # github secrets (see readme for details)
    needs: [test, build-and-inspect-package]
    runs-on: ubuntu-latest
    if: contains(github.ref, 'tags')
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing on PyPi
      # see https://docs.pypi.org/trusted-publishers/
      id-token: write
      # This permission allows writing releases
      contents: write

    steps:
    - name: Download built artifact to dist/
      uses: actions/download-artifact@v7
      with:
        name: Packages
        path: dist
    
    - name: 🚢 Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
    
    - uses: softprops/action-gh-release@v3
      with:
        generate_release_notes: true
        files: './dist/*'