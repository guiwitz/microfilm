# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py{311,312,313,314}-{linux,macos,windows}
isolated_build=true

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    
[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform = 
    macos: darwin
    linux: linux
    windows: win32

setenv =
    MPLBACKEND = Agg

deps = 
    pytest

extras =
    all

commands = pytest -v